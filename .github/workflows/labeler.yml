---
name: Pull Request Labeler
"on":
  workflow_run: # zizmor: ignore[dangerous-triggers] -- no PR code is checked out or executed
    workflows: ["Pull Request Labeler Signal"]
    types: [completed]
permissions: { }
jobs:
  triage:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Find pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected pull request head SHA"
            exit 1
          fi

          # commits/{sha}/pulls does not find pull requests from forks,
          # so look up by head owner:branch and match the head SHA
          pr_numbers=$(gh api -X GET "repos/$REPO/pulls" \
            -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number")
          if [[ -z "$pr_numbers" ]]; then
            echo "::warning::No open pull request found for $HEAD_OWNER:$HEAD_BRANCH@$HEAD_SHA"
          fi
          {
            echo "numbers<<EOF"
            printf '%s\n' "$pr_numbers"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        if: steps.pr.outputs.numbers != ''
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          pr-number: ${{ steps.pr.outputs.numbers }}
          sync-labels: true
