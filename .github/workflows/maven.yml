---
name: Maven CI

permissions:
  contents: read

on:
  workflow_dispatch: { }
  push:
    branches: [ main, '3.x', '4.x' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Build with Maven
        run: >-
          ./mvnw verify --show-version --errors --batch-mode --no-transfer-progress -Pdocs
          -DskipTests -DskipITs

      - name: Bundle build output
        run: find . -path './.mvn' -prune -o -type d -name target -prune -print0 | tar --null -T - -czf ci-build.tar.gz

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-build
          path: ci-build.tar.gz
          retention-days: 1

  test:
    needs: build

    strategy:
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest', 'macOS-latest' ]
        jdk: [ 17, 21, 25 ]
        dist: [ 'temurin', 'semeru', 'zulu' ]
        exclude:
          # Zulu covers HotSpot on macOS and Windows; Semeru covers OpenJ9.
          - { os: 'macOS-latest', dist: 'temurin' }
          - { os: 'windows-latest', dist: 'temurin' }
      fail-fast: false

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up test JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.jdk }}
          distribution: ${{ matrix.dist }}

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-build

      - name: Restore build output
        run: tar -xzf ci-build.tar.gz

      - name: Test with Maven
        env:
          JAKARTA_EE_TESTS: ${{ matrix.os == 'ubuntu-latest' && matrix.jdk == 25 }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--show-version --errors --batch-mode --no-transfer-progress
            -Dmaven.main.skip=true -Dmaven.test.compile.skip=true -Daspectj.skip=true
            -Dcheckstyle.skip -DminimalJavaBuildVersion=17 "-Dgh_user=$GH_USER" "-Dgh_token=$GH_TOKEN")
          if [ "$JAKARTA_EE_TESTS" != true ]; then
            args+=(-Pskip_jakarta_ee_tests)
          fi
          ./mvnw verify "${args[@]}"

      - name: Archive test run logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.jdk }}-${{ matrix.dist }}
          path: |
            **/target/failsafe-reports/*-output.txt
            **/target/**/logs/server.log
