<!--
  Login-page notice that the user's form data was saved and will be submitted after sign-in,
  with a checkbox to discard it instead. Renders nothing when no form data is saved.
  Place inside the login form; works with Faces and plain HTML submit buttons alike.
-->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:cc="jakarta.faces.composite"
              xmlns:h="jakarta.faces.html">
    <cc:interface>
        <cc:attribute name="message"
                      default="We saved the form data you entered before signing in. It will be submitted for you once you sign in."/>
        <cc:attribute name="discardLabel" default="Discard my form data"/>
    </cc:interface>
    <cc:implementation>
        <h:panelGroup layout="block" styleClass="shiro-form-data-notice" rendered="#{authc.formDataSaved}">
            <h:outputText value="#{cc.attrs.message}" styleClass="shiro-form-data-message"/>
            <label class="shiro-form-data-discard">
                <input type="checkbox" name="#{authc.discardFormDataParameter}"/> #{cc.attrs.discardLabel}
            </label>
        </h:panelGroup>
    </cc:implementation>
</ui:component>
